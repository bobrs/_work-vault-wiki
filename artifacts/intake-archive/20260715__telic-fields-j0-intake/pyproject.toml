[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telic-fields-j0"
version = "0.1.0"
description = "Telic Fields J.0 reference implementation and pilot harness"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
telic-j0 = "telic_j0.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
