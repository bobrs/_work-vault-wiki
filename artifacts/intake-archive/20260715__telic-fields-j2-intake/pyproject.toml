[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telic-fields-j2"
version = "0.1.0"
description = "Telic Fields J.2 multi-party trial and release candidate"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "cryptography>=41"]

[project.scripts]
telic-j2 = "telic_j2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
