[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telic-fields-j1"
version = "0.1.0"
description = "Telic Fields J.1 independent verification and pilot hardening"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "cryptography>=41"]

[project.scripts]
telic-j1 = "telic_j1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
